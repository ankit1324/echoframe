name: Release

# Every merge to main that touches something shippable produces a signed release.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch:

# Never let two releases build at once: they would race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Test, build signed APKs, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Fail here rather than three minutes later with an unsigned artifact.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ECHOFRAME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ECHOFRAME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ECHOFRAME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ECHOFRAME_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ECHOFRAME_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ]  || missing="$missing ECHOFRAME_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]       || missing="$missing ECHOFRAME_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]    || missing="$missing ECHOFRAME_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see README, 'Releases' section."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ECHOFRAME_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > echoframe-release.jks
          test -s echoframe-release.jks || { echo "::error::Decoded keystore is empty"; exit 1; }

      - name: Build signed release APKs
        env:
          ECHOFRAME_STORE_FILE: echoframe-release.jks
          ECHOFRAME_STORE_PASSWORD: ${{ secrets.ECHOFRAME_STORE_PASSWORD }}
          ECHOFRAME_KEY_ALIAS: ${{ secrets.ECHOFRAME_KEY_ALIAS }}
          ECHOFRAME_KEY_PASSWORD: ${{ secrets.ECHOFRAME_KEY_PASSWORD }}
          # Distinct, monotonically increasing versionCode per release build.
          ECHOFRAME_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      # An unsigned APK still builds successfully — the signing config is simply absent — so the
      # signature is checked explicitly instead of being assumed from a green build.
      - name: Verify signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk" || { echo "::error::$apk is not validly signed"; exit 1; }
          done

      - name: Name the artifacts
        id: names
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          test -n "$VERSION_NAME" || { echo "::error::could not read versionName"; exit 1; }
          TAG="v${VERSION_NAME}-build.${RUN_NUMBER}"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            # app-arm64-v8a-release.apk -> echoframe-<version>-arm64-v8a.apk
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "dist/echoframe-${VERSION_NAME}-${abi}.apk"
          done
          ls -l dist
          {
            echo "tag=$TAG"
            echo "version=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          {
            echo "Automated release of \`${GITHUB_SHA}\` from main."
            echo
            echo "Unit tests and lint passed; every APK below was signature-verified in CI."
            echo
            echo "**Which APK?** \`arm64-v8a\` for any modern phone. \`armeabi-v7a\` for older 32-bit"
            echo "devices. \`universal\` works everywhere but is ~3x larger, because it carries the"
            echo "x86 ML Kit libraries that only emulators use."
            echo
            echo "Requires Android 12 (API 31) or newer. Set Echoframe as your assistant under"
            echo "Settings → Apps → Default apps → Digital assistant app."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "Echoframe $VERSION (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Shred keystore
        if: always()
        run: rm -f echoframe-release.jks
